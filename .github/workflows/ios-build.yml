name: ios-build

# Build the Capacitor iOS shell. No Apple Developer account is used (see
# MOBILE.md): the job produces an unsigned .app bundle zipped as an artifact,
# suitable for re-signing with AltStore/Sideloadly (free, re-sign every 7 days).
on:
  push:
    branches: ["mobile/android-ios"]
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets
        run: npx cap sync ios

      - name: Build unsigned .app (xcodebuild, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build | xcpretty

      - name: Zip unsigned .app
        run: |
          cd build/Build/Products/Release-iphoneos
          zip -qry "$GITHUB_WORKSPACE/climate-canvas-unsigned-ios.zip" App.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: climate-canvas-unsigned-ios
          path: climate-canvas-unsigned-ios.zip
          retention-days: 30
