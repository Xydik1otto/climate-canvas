<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>climate-canvas — тижневий звіт</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1419">
<link rel="stylesheet" href="/static/style.css">
<style>
  table { border-collapse: collapse; margin-top: 16px; font-size: .9rem; }
  th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: right; }
  th { background: var(--card); }
  td:first-child, th:first-child { text-align: left; }
  .legend span { margin-right: 14px; font-size: .85rem; }
  .actions { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; align-items:center; }
  .btn { display:inline-block; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 12px; text-decoration:none; cursor:pointer; }
  #email-form { max-width:420px; }
  #email-form label { display:block; margin:8px 0 4px; font-size:.9rem; }
  #email-form label.chk { display:flex; gap:6px; align-items:center; margin-top:10px; }
  #email-form input { display:block; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; width:100%; }
  #email-form label.chk input { width:auto; }
  .ok { color:#7bd88f; } .err { color:#e06c75; }
</style>
</head>
<body>
<header>
  <h1>📊 Тижневий звіт</h1>
  <a href="/" id="settings-link" title="Назад до дашборда">← Дашборд</a>
</header>
<main>
  <div id="report-status" class="hint">Завантаження…</div>
  <div id="report-chart" class="legend"></div>
  <div id="report-table"></div>

  <h2>Експорт</h2>
  <div class="actions">
    <a id="pdf-btn" class="btn" href="/api/report/weekly.pdf" download
       aria-label="Завантажити тижневий звіт у PDF">⬇️ Завантажити PDF</a>
  </div>

  <h2>Надіслати на email (опційно)</h2>
  <p class="hint">SMTP-налаштування зберігаються локально у <code>data/settings.json</code>.</p>
  <form id="email-form">
    <label for="em-to">Кому</label>
    <input id="em-to" type="email" placeholder="you@example.com">
    <label for="em-host">SMTP-сервер</label>
    <input id="em-host" type="text" placeholder="smtp.example.com">
    <label for="em-port">Порт</label>
    <input id="em-port" type="number" value="587">
    <label for="em-user">Користувач</label>
    <input id="em-user" type="text" autocomplete="off">
    <label for="em-pass">Пароль</label>
    <input id="em-pass" type="password" autocomplete="new-password">
    <label for="em-from">Від (From)</label>
    <input id="em-from" type="email" placeholder="climate-canvas@example.com">
    <label class="chk"><input id="em-tls" type="checkbox" checked> TLS (STARTTLS)</label>
    <div class="actions">
      <button type="button" id="em-save">💾 Зберегти SMTP</button>
      <button type="submit" id="em-send">✉️ Надіслати звіт</button>
    </div>
    <p id="email-status" class="hint" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
const PALETTE = ["#4ecdc4", "#e5c07b", "#61afef", "#e06c75", "#7bd88f", "#c678dd"];

async function loadReport() {
  const data = await fetch("/api/report/weekly").then((r) => r.json());
  const rooms = Object.entries(data.rooms);
  if (!rooms.length) {
    document.querySelector("#report-status").textContent = "Немає даних за останні 7 днів.";
    return;
  }
  document.querySelector("#report-status").textContent = `Дані за останні ${data.days} днів · згенеровано ${new Date().toLocaleString("uk-UA")}`;

  // ----- SVG line chart: daily mean temperature per room -----
  const W = 720, H = 280, PAD_L = 44, PAD_B = 28, PAD_T = 12, PAD_R = 12;
  const maxDays = Math.max(...rooms.map(([, r]) => r.daily.length));
  const all = rooms.flatMap(([, r]) => r.daily.map(([, v]) => v));
  const yMin = Math.floor(Math.min(...all) - 1), yMax = Math.ceil(Math.max(...all) + 1);
  const x = (i, n) => PAD_L + (n <= 1 ? 0 : i * (W - PAD_L - PAD_R) / (n - 1));
  const y = (v) => PAD_T + (H - PAD_T - PAD_B) * (1 - (v - yMin) / (yMax - yMin || 1));
  let svg = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">`;
  for (let tick = yMin; tick <= yMax; tick += Math.max(1, Math.ceil((yMax - yMin) / 8))) {
    svg += `<line x1="${PAD_L}" y1="${y(tick)}" x2="${W - PAD_R}" y2="${y(tick)}" stroke="var(--border)" stroke-width="1"/>`;
    svg += `<text x="${PAD_L - 6}" y="${y(tick) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${tick}°</text>`;
  }
  rooms.forEach(([room, r], ri) => {
    const color = PALETTE[ri % PALETTE.length];
    const n = r.daily.length;
    const pts = r.daily.map(([, v], i) => `${x(i, n)},${y(v)}`).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>`;
    r.daily.forEach(([d], i) => {
      if (ri === 0) svg += `<text x="${x(i, n)}" y="${H - 8}" font-size="9" fill="var(--muted)" text-anchor="middle">${d.slice(5)}</text>`;
    });
  });
  svg += "</svg>";
  const legend = rooms.map(([room], ri) =>
    `<span style="color:${PALETTE[ri % PALETTE.length]}">■ ${room}</span>`).join("");
  document.querySelector("#report-chart").innerHTML = svg + `<div class="legend">${legend}</div>`;

  // ----- Stats table -----
  let table = "<table><tr><th>Кімната</th><th>Середня</th><th>Мін</th><th>Макс</th><th>Вологість (сер.)</th><th>Точок</th></tr>";
  for (const [room, r] of rooms) {
    table += `<tr><td>${room}</td><td>${r.avg}°C</td><td>${r.min}°C</td><td>${r.max}°C</td>` +
      `<td>${r.humidity_avg != null ? r.humidity_avg + "%" : "—"}</td><td>${r.samples}</td></tr>`;
  }
  document.querySelector("#report-table").innerHTML = table + "</table>";
}
loadReport();

// ---------- PDF + email export ----------
async function loadSmtp() {
  try {
    const s = await fetch("/api/smtp").then((r) => r.json());
    if (s.host) $("#em-host").value = s.host;
    if (s.port) $("#em-port").value = s.port;
    if (s.user) $("#em-user").value = s.user;
    if (s.from) $("#em-from").value = s.from;
    $("#em-tls").checked = s.tls !== false;
    if (s.password_set) $("#em-pass").placeholder = `•••••••• (збережено ${s.password_hint})`;
  } catch { /* optional */ }
}
loadSmtp();

$("#em-save").addEventListener("click", async () => {
  const st = $("#email-status");
  const body = {
    smtp_host: $("#em-host").value.trim(),
    smtp_port: parseInt($("#em-port").value, 10) || 587,
    smtp_user: $("#em-user").value.trim(),
    smtp_from: $("#em-from").value.trim(),
    smtp_tls: $("#em-tls").checked,
  };
  if ($("#em-pass").value.trim()) body.smtp_password = $("#em-pass").value.trim();
  const r = await fetch("/api/smtp", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  st.textContent = r.ok ? "✅ SMTP-налаштування збережено." : `❌ ${((await r.json()).detail ?? "помилка")}`;
  st.className = r.ok ? "ok" : "err";
});

$("#email-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const st = $("#email-status");
  st.textContent = "⏳ Формую PDF і надсилаю…";
  const body = { to: $("#em-to").value.trim() };
  if ($("#em-host").value.trim()) body.smtp_host = $("#em-host").value.trim();
  if ($("#em-pass").value.trim()) body.smtp_password = $("#em-pass").value.trim();
  const r = await fetch("/api/report/email", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await r.json();
  if (r.ok) {
    st.textContent = `✅ Звіт надіслано на ${data.to}.`;
    st.className = "ok";
  } else {
    st.textContent = `❌ ${data.detail ?? "помилка"}`;
    st.className = "err";
  }
});
</script>
</body>
</html>
