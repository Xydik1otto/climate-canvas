<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>climate-canvas</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1419">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <h1>🏠 Climate Canvas</h1>
  <nav>
    <button data-view="rooms" class="active">Кімнати</button>
    <button data-view="timeline">Таймлайн</button>
    <button data-view="heatmap">Теплова мапа</button>
    <button data-view="seasons">Сезони</button>
    <button data-view="energy">Енергія</button>
    <a href="/report" id="report-link" title="Тижневий звіт">📊</a>
    <a href="/settings" id="settings-link" title="Налаштування сенсорів">⚙️</a>
  </nav>
  <span id="mode-badge"></span>
  <button id="theme-toggle" title="Світла/темна тема">☀️</button>
</header>

<main>
  <section id="view-rooms" class="view active">
    <div id="room-grid" class="grid"></div>
  </section>

  <section id="view-timeline" class="view">
    <div class="controls">
      <select id="tl-room"></select>
      <select id="tl-metric">
        <option value="temperature">Температура</option>
        <option value="humidity">Вологість</option>
        <option value="co2">CO₂</option>
        <option value="voc">VOC</option>
      </select>
      <select id="tl-days">
        <option value="7">7 днів</option>
        <option value="30">30 днів</option>
        <option value="90">90 днів</option>
      </select>
      <label class="hint"><input type="checkbox" id="tl-forecast"> Прогноз 48 год</label>
    </div>
    <canvas id="timeline-chart" height="110"></canvas>
    <div id="tl-hint" class="hint">Клікніть по графіку, щоб додати мітку (відкрито вікно, відпустка…)</div>
    <div id="tl-annotations"></div>
  </section>

  <section id="view-heatmap" class="view">
    <div class="controls">
      <select id="hm-room"></select>
      <select id="hm-metric">
        <option value="temperature">Температура</option>
        <option value="humidity">Вологість</option>
        <option value="dew_point">Точка роси</option>
        <option value="mold_risk">Ризик цвілі</option>
      </select>
      <select id="hm-days">
        <option value="30">30 днів</option>
        <option value="90" selected>90 днів</option>
      </select>
    </div>
    <div id="heatmap"></div>
    <div id="hm-legend"></div>
  </section>

  <section id="view-seasons" class="view">
    <div class="controls">
      <select id="se-room"></select>
      <select id="se-month"></select>
    </div>
    <canvas id="seasons-chart" height="110"></canvas>
  </section>

  <section id="view-energy" class="view">
    <div class="controls">
      <select id="en-room"></select>
      <select id="en-days">
        <option value="7">7 днів</option>
        <option value="30" selected>30 днів</option>
        <option value="90">90 днів</option>
      </select>
      <label>Ціна kWh: <input id="en-price" type="number" step="0.01" min="0" style="width:90px"></label>
    </div>
    <div id="energy-total"></div>
    <canvas id="energy-chart" height="110"></canvas>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
