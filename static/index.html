<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>climate-canvas</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1419">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta property="og:title" content="Climate Canvas — клімат дому">
<meta property="og:description" content="Довгострокова візуалізація температури, вологості, CO₂, VOC та енергії з Home Assistant: таймлайни, теплові мапи, точка роси, прогноз погоди.">
<meta property="og:type" content="website">
<meta property="og:image" content="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <h1>🏠 Climate Canvas</h1>
  <nav>
    <button data-view="rooms" class="active" data-i18n="nav_rooms">Кімнати</button>
    <button data-view="timeline" data-i18n="nav_timeline">Таймлайн</button>
    <button data-view="heatmap" data-i18n="nav_heatmap">Теплова мапа</button>
    <button data-view="seasons" data-i18n="nav_seasons">Сезони</button>
    <button data-view="energy" data-i18n="nav_energy">Енергія</button>
    <a href="/report" id="report-link" data-i18n-title="report_link_title" title="Тижневий звіт" aria-label="Тижневий звіт">📊</a>
    <a href="/settings" id="settings-link" data-i18n-title="settings_link_title" title="Налаштування сенсорів" aria-label="Налаштування сенсорів">⚙️</a>
  </nav>
  <span id="mode-badge" role="status" aria-live="polite"></span>
  <button id="lang-toggle" title="Мова інтерфейсу" aria-label="Перемкнути мову UA/EN">EN</button>
  <button id="theme-toggle" data-i18n-title="theme_title" title="Світла/темна тема" aria-label="Перемкнути світлу/темну тему">☀️</button>
</header>

<main>
  <div id="first-run" hidden>
    <p><span data-i18n="demo_banner">Схоже, це перший запуск — історії ще немає. Завантажити демо-дані, щоб побачити всі вьюхи?</span></p>
    <button id="demo-seed-btn" data-i18n="demo_btn">📦 Завантажити демо</button>
    <button id="demo-dismiss-btn" class="btn" data-i18n="demo_later">Ні, дякую</button>
  </div>
  <section id="view-rooms" class="view active">
    <div id="room-grid" class="grid"></div>
  </section>

  <section id="view-timeline" class="view">
    <div class="controls">
      <select id="tl-room" aria-label="Кімната"></select>
      <select id="tl-metric" aria-label="Метрика">
        <option value="temperature" data-i18n="metric_temperature">Температура</option>
        <option value="humidity" data-i18n="metric_humidity">Вологість</option>
        <option value="co2" data-i18n="metric_co2">CO₂</option>
        <option value="voc" data-i18n="metric_voc">VOC</option>
      </select>
      <select id="tl-days" aria-label="Період">
        <option value="7" data-i18n="days_7">7 днів</option>
        <option value="30" data-i18n="days_30">30 днів</option>
        <option value="90" data-i18n="days_90">90 днів</option>
      </select>
      <label class="hint"><input type="checkbox" id="tl-forecast" aria-label="Прогноз 48 годин"> <span data-i18n="forecast_label">Прогноз 48 год</span></label>
    </div>
    <canvas id="timeline-chart" height="110" role="img" aria-label="Графік температури та вологості в часі"></canvas>
    <div id="tl-hint" class="hint" data-i18n="tl_hint">Клікніть по графіку, щоб додати мітку (відкрито вікно, відпустка…)</div>
    <div id="tl-annotations"></div>
  </section>

  <section id="view-heatmap" class="view">
    <div class="controls">
      <select id="hm-room" aria-label="Кімната"></select>
      <select id="hm-metric" aria-label="Метрика">
        <option value="temperature" data-i18n="metric_temperature">Температура</option>
        <option value="humidity" data-i18n="metric_humidity">Вологість</option>
        <option value="dew_point" data-i18n="metric_dew_point">Точка роси</option>
        <option value="mold_risk" data-i18n="metric_mold_risk">Ризик цвілі</option>
      </select>
      <select id="hm-days" aria-label="Період">
        <option value="30" data-i18n="days_30">30 днів</option>
        <option value="90" selected data-i18n="days_90">90 днів</option>
      </select>
    </div>
    <div id="heatmap" role="img" aria-label="Теплова мапа день × година"></div>
    <div id="hm-legend"></div>
  </section>

  <section id="view-seasons" class="view">
    <div class="controls">
      <select id="se-room" aria-label="Кімната"></select>
      <select id="se-month" aria-label="Місяць"></select>
    </div>
    <canvas id="seasons-chart" height="110" role="img" aria-label="Порівняння сезонів по роках"></canvas>
  </section>

  <section id="view-energy" class="view">
    <div class="controls">
      <select id="en-room" aria-label="Кімната"></select>
      <select id="en-days" aria-label="Період">
        <option value="7" data-i18n="days_7">7 днів</option>
        <option value="30" selected data-i18n="days_30">30 днів</option>
        <option value="90" data-i18n="days_90">90 днів</option>
      </select>
      <label><span data-i18n="energy_price">Ціна kWh:</span> <input id="en-price" type="number" step="0.01" min="0" style="width:90px" aria-label="Ціна kWh"></label>
    </div>
    <div id="energy-total"></div>
    <canvas id="energy-chart" height="110" role="img" aria-label="Споживання енергії по днях"></canvas>
  </section>
</main>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
